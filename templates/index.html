<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An AI-powered chatbot interface built with FastAPI, Groq Llama 3, HTML, CSS, and JavaScript.">
    <title>Groq AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-decor" aria-hidden="true">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="chat-wrapper" role="application" aria-label="AI Chat Interface">
        <header class="chat-header">
            <div class="brand-panel">
                <div class="avatar-container">
                    <span class="bot-avatar" aria-hidden="true">
                        <i class="fa-solid fa-robot"></i>
                    </span>
                </div>
                <div>
                    <p class="label">AI Assistant</p>
                    <h1>Groq Chat</h1>
                </div>
            </div>
            <div class="header-actions">
                <button id="clear-chat" type="button" title="Clear chat history" aria-label="Clear chat history">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </header>

        <section class="chat-content">
            <div class="sidebar-card">
                <div class="sidebar-title">
                    <div class="status-dot online"></div>
                    <div>
                        <p class="label">System</p>
                        <p class="sidebar-text">Ready to help with your questions.</p>
                    </div>
                </div>
                <p class="sidebar-note">Ask anything about Groq, Llama 3, FastAPI, or your AI workflow.</p>
            </div>

            <div class="messages-panel" id="chat-messages" aria-live="polite" aria-relevant="additions text"></div>
        </section>

        <div class="typing-indicator-container" id="typing-indicator" aria-hidden="true" style="display: none;">
            <div class="typing-bubble">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <footer class="chat-input-area">
            <form id="chat-form" class="chat-form">
                <label for="user-input" class="visually-hidden">Type your message</label>
                <input
                    type="text"
                    id="user-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                    aria-label="Type your message"
                    required
                >
                <button type="submit" id="send-button" aria-label="Send message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </footer>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
